name: Windows x64 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure, build, and test Debug and Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) {
            throw 'MSVC Build Tools were not found on the Windows runner.'
          }

          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell `
            -VsInstallPath $vsPath `
            -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'

          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'The hosted runner did not provide VCPKG_INSTALLATION_ROOT.'
          }
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT

          $baseline = 'b5229343b4b80264ed51e89c6a7dcd0cbe85e9cc'
          if (-not (Test-Path -LiteralPath $env:VCPKG_ROOT -PathType Container)) {
            throw "VCPKG_ROOT does not exist: $env:VCPKG_ROOT"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:VCPKG_ROOT '.git'))) {
            throw 'VCPKG_ROOT is not a Git repository.'
          }

          $isShallow = & git -C $env:VCPKG_ROOT rev-parse --is-shallow-repository
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to determine whether the vcpkg repository is shallow.'
          }
          if ($isShallow -eq 'true') {
            & git -C $env:VCPKG_ROOT fetch --unshallow --no-tags origin
          } else {
            & git -C $env:VCPKG_ROOT fetch --no-tags origin
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to hydrate the vcpkg Git history.'
          }

          & git -C $env:VCPKG_ROOT cat-file -e "$baseline^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg baseline commit is unavailable: $baseline"
          }
          & git -C $env:VCPKG_ROOT show "${baseline}:versions/baseline.json" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg baseline file is unavailable: ${baseline}:versions/baseline.json"
          }

          cmake --preset msvc-debug -DASSETBRIDGE_PACKAGE_GUI_SMOKE=OFF
          cmake --build --preset msvc-debug
          ctest --preset msvc-debug -LE gui

          cmake --preset msvc-release -DASSETBRIDGE_PACKAGE_GUI_SMOKE=OFF
          cmake --build --preset msvc-release
          ctest --preset msvc-release -LE gui
          cmake --build --preset msvc-release --target package

      # Hosted Windows runners do not provide a reliable interactive desktop or
      # hardware-backed DX11 session. Tests labeled "gui" are deliberately
      # excluded above; local Release acceptance executes and reports them.
